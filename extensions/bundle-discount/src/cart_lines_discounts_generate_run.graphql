query CartInput {
  cart {
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      bundleId: attribute(key: "_bundle_id") {
        value
      }
      instanceId: attribute(key: "_bundle_instance_id") {
        value
      }
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    configuration: metafield(namespace: "$app:bundlecraft", key: "config") {
      value
    }
  }
}
